services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neta_coordinator
      POSTGRES_USER: neta
      POSTGRES_PASSWORD: neta-dev-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neta -d neta_coordinator"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - neta-postgres:/var/lib/postgresql/data
volumes:
  neta-postgres:

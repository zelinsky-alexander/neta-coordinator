services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NETA_DB_NAME:-neta_coordinator}
      POSTGRES_USER: ${NETA_DB_USER:-neta}
      POSTGRES_PASSWORD: ${NETA_DB_PASSWORD:?NETA_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NETA_DB_USER:-neta} -d ${NETA_DB_NAME:-neta_coordinator}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - neta-postgres:/var/lib/postgresql/data
    networks:
      - neta-internal

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NETA_DB_URL: jdbc:postgresql://postgres:5432/${NETA_DB_NAME:-neta_coordinator}
      NETA_DB_USER: ${NETA_DB_USER:-neta}
      NETA_DB_PASSWORD: ${NETA_DB_PASSWORD:?NETA_DB_PASSWORD is required}
      NETA_FLEET_ID: ${NETA_FLEET_ID:-fleet-dev}
      NETA_BOOTSTRAP_ENROLLMENT_TOKEN: ${NETA_BOOTSTRAP_ENROLLMENT_TOKEN:?NETA_BOOTSTRAP_ENROLLMENT_TOKEN is required}
      NETA_REQUIRE_CLIENT_CERTIFICATE: ${NETA_REQUIRE_CLIENT_CERTIFICATE:-false}
      NETA_OPERATOR_ADMIN_TOKEN: ${NETA_OPERATOR_ADMIN_TOKEN:-}
      NETA_ENROLLMENT_CERTIFICATE_TTL: ${NETA_ENROLLMENT_CERTIFICATE_TTL:-P90D}
      NETA_CERTIFICATE_WARNING_WINDOW: ${NETA_CERTIFICATE_WARNING_WINDOW:-P30D}
      NETA_CERTIFICATE_CRITICAL_WINDOW: ${NETA_CERTIFICATE_CRITICAL_WINDOW:-P7D}
      NETA_AGENT_ONLINE_THRESHOLD: ${NETA_AGENT_ONLINE_THRESHOLD:-PT7M}
      NETA_AGENT_OFFLINE_THRESHOLD: ${NETA_AGENT_OFFLINE_THRESHOLD:-PT15M}
      NETA_INCIDENT_SYNC_INTERVAL: ${NETA_INCIDENT_SYNC_INTERVAL:-PT1M}
      NETA_RETAIN_HEARTBEATS: ${NETA_RETAIN_HEARTBEATS:-false}
      NETA_AUDIT_HEARTBEATS: ${NETA_AUDIT_HEARTBEATS:-false}
      NETA_PROTOCOL_RETENTION: ${NETA_PROTOCOL_RETENTION:-P7D}
      NETA_ACCEPTED_AUDIT_RETENTION: ${NETA_ACCEPTED_AUDIT_RETENTION:-P30D}
      NETA_STORAGE_CLEANUP_INTERVAL: ${NETA_STORAGE_CLEANUP_INTERVAL:-PT1H}
      NETA_PORT: 8080
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60.0 -XX:+UseG1GC}
    ports:
      - "${NETA_BIND_ADDRESS:-127.0.0.1}:${NETA_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - neta-edge
      - neta-internal

volumes:
  neta-postgres:

networks:
  neta-edge:
    driver: bridge
  neta-internal:
    internal: true
